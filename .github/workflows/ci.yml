name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./install.sh
      - run: node --check shared/web/app.js
      - run: python3 scripts/smoke.py build/linux/investment-radar
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build native Windows app and tests
        shell: cmd
        env:
          IR_NONINTERACTIVE: '1'
        run: install.bat
      - name: Smoke test native API
        run: python scripts/smoke.py build/windows/Release/investment-radar.exe
      - uses: actions/upload-artifact@v4
        with:
          name: investment-radar-windows
          if-no-files-found: error
          path: |
            build/windows/Release/investment-radar.exe
            build/windows/Release/*.dll
            build/windows/Release/assets/
