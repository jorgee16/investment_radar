name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./install.sh
      - run: node --check shared/web/app.js
      - run: python3 scripts/smoke.py build/linux/investment-radar
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: build
          load: true
          tags: investment-radar-build:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test inside the built image
        run: docker run --rm investment-radar-build:ci
  windows:
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.tools\vcpkg-binary-cache
    steps:
      - uses: actions/checkout@v4
      - name: Prepare dependency cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: windows-vcpkg-${{ hashFiles('vcpkg.json', 'CMakePresets.json', 'cmake/triplets/**') }}
      - name: Build native Windows app and tests
        shell: cmd
        env:
          IR_NONINTERACTIVE: '1'
        run: install.bat
      - name: Smoke test native API
        run: python scripts/smoke.py build/windows/Release/investment-radar.exe
      - name: Package app and runtime libraries
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Compose desktop
        shell: pwsh
        run: .\android\gradlew.bat -p desktop-compose --no-daemon compileKotlin
      - name: Create Compose desktop distributable
        shell: pwsh
        run: .\android\gradlew.bat -p desktop-compose --no-daemon createDistributable
      - name: Bundle native C++ host with Compose desktop
        shell: pwsh
        run: |
          $launcher = Get-ChildItem -Path desktop-compose/build/compose/binaries/main/app -Filter '*.exe' -Recurse |
            Where-Object { $_.Name -like 'Investment Radar*' } |
            Select-Object -First 1
          if (-not $launcher) { throw 'Compose launcher not found' }
          $appDir = $launcher.Directory.FullName
          Copy-Item build/windows/Release/investment-radar-core-host.exe $appDir/investment-radar-core-host.exe
          Get-ChildItem build/windows/Release -Filter '*.dll' | ForEach-Object { Copy-Item $_.FullName $appDir }
          Copy-Item -Recurse build/windows/Release/assets $appDir/assets
          if (-not (Test-Path "$appDir/investment-radar-core-host.exe")) { throw 'Native core host missing from Compose package' }
          if (-not (Test-Path "$appDir/assets/index.html")) { throw 'Native host assets missing from Compose package' }
          $composeOut = 'dist/windows/investment-radar-compose-windows-x64'
          Remove-Item -Recurse -Force $composeOut -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $composeOut | Out-Null
          Copy-Item -Recurse (Split-Path $launcher.FullName -Parent)/* $composeOut/
          Compress-Archive -Path "$composeOut/*" -DestinationPath dist/windows/investment-radar-compose-windows-x64.zip -Force
      - name: Test extracted package independently of the build folder
        shell: pwsh
        run: |
          $packageTest = Join-Path $env:RUNNER_TEMP 'radar package test'
          Expand-Archive -LiteralPath dist/windows/investment-radar-windows-x64.zip -DestinationPath $packageTest
          python scripts/smoke.py "$packageTest/investment-radar-windows-x64/investment-radar.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: investment-radar-compose-windows
          if-no-files-found: error
          path: dist/windows/investment-radar-compose-windows-x64/
      - uses: actions/upload-artifact@v4
        with:
          name: investment-radar-compose-windows-zip
          if-no-files-found: error
          path: dist/windows/investment-radar-compose-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: investment-radar-windows
          if-no-files-found: error
          path: ${{ runner.temp }}/radar package test/investment-radar-windows-x64/
      - uses: actions/upload-artifact@v4
        with:
          name: investment-radar-windows-zip
          if-no-files-found: error
          path: |
            dist/windows/*.zip
            dist/windows/*.sha256
