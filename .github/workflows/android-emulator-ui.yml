name: Android emulator UI smoke

on:
  push:
    branches: [codex/initial-implementation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Build and test APK
        run: ./android/gradlew -p android :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch Android 15 emulator and capture UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.investmentradar.app/.MainActivity
            sleep 12
            adb shell pidof com.investmentradar.app
            adb shell wm size 360x800
            adb shell wm density 160
            sleep 3
            adb shell screencap -p /sdcard/ir-360.png
            adb pull /sdcard/ir-360.png screenshot-360.png
            adb shell wm size 412x915
            sleep 3
            adb shell screencap -p /sdcard/ir-412.png
            adb pull /sdcard/ir-412.png screenshot-412.png
            # Exercise the bottom navigation on the larger phone profile.
            adb shell input tap 122 860
            sleep 3
            adb shell screencap -p /sdcard/ir-portfolio.png
            adb pull /sdcard/ir-portfolio.png screenshot-portfolio.png
            adb shell input tap 205 860
            sleep 3
            adb shell screencap -p /sdcard/ir-watchlist.png
            adb pull /sdcard/ir-watchlist.png screenshot-watchlist.png
            adb shell input tap 286 860
            sleep 3
            adb shell screencap -p /sdcard/ir-asset.png
            adb pull /sdcard/ir-asset.png screenshot-asset.png
            adb shell input tap 369 860
            sleep 2
            adb shell screencap -p /sdcard/ir-more.png
            adb pull /sdcard/ir-more.png screenshot-more.png
            adb logcat -d -s AndroidRuntime:E > android-runtime.log
            ! grep -q 'FATAL EXCEPTION' android-runtime.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-ui-screenshots
          path: |
            screenshot-*.png
            android-runtime.log
          if-no-files-found: warn
