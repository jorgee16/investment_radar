name: Android emulator UI smoke
concurrency:
  group: android-ui-${{ github.ref }}
  cancel-in-progress: true
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Android build tools
        shell: bash
        run: |
          # Pin CLI 19 to the same JDK 21-compatible toolchain tested locally.
          # Hosted "latest" command-line tools can require a newer Java runtime.
          archive="$RUNNER_TEMP/android-cli-19.zip"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 --http1.1 --connect-timeout 30 --max-time 300 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$archive"
          echo "7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee  $archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/android-cli-19"
          # avdmanager discovers the SDK from cmdline-tools/<version>/bin;
          # unlike sdkmanager it has no --sdk_root override.
          mkdir -p "$ANDROID_HOME/cmdline-tools/19.0"
          cp -a "$RUNNER_TEMP/android-cli-19/cmdline-tools/." "$ANDROID_HOME/cmdline-tools/19.0/"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/19.0/bin/sdkmanager"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      # A stable signing identity is mandatory for Android in-place upgrades.
      # Configure ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD as repository secrets.
      # Retain the persistent signing key used by the published 0.6.4 release.
      - name: Restore persistent Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Stable signing secrets are missing. Refusing to publish a non-upgradeable APK."
            exit 1
          fi
          keystore="$RUNNER_TEMP/investment-radar-signing.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "IR_ANDROID_KEYSTORE=$keystore" >> "$GITHUB_ENV"
          echo "IR_ANDROID_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          export IR_ANDROID_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          keytool -list -keystore "$keystore" -storepass:env IR_ANDROID_STORE_PASSWORD -alias investment-radar >/dev/null
      - name: Build Release and instrumentation APKs and run lint
        working-directory: android
        run: ./gradlew :app:assembleRelease :app:assembleReleaseAndroidTest :app:lintRelease :app:testReleaseUnitTest -PirTestBuildType=release --no-daemon --console=plain
      - name: Verify the packaged offline catalogue before emulator tests
        run: python3 scripts/check_android_catalogue.py android/app/build/outputs/apk/release/app-release.apk
      - name: Preserve release inputs and build future-upgrade probe
        working-directory: android
        run: |
          mkdir -p ../dist/android-inputs
          cp app/build/outputs/apk/release/app-release.apk ../dist/android-inputs/investment-radar-0.6.11.apk
          cp app/build/outputs/apk/androidTest/release/app-release-androidTest.apk ../dist/android-inputs/instrumentation.apk
          curl --fail --location --retry 3 https://github.com/jorgee16/investment_radar/releases/download/android-0.6.4-97f58ea86d98/investment-radar-0.6.4.apk -o ../dist/android-inputs/previous-release.apk
          echo "b3c23d2a49be81bdb1570ca1bcede538b0abf0384b3def7d3544b22ecd37c05c  ../dist/android-inputs/previous-release.apk" | sha256sum --check
          curl --fail --location --retry 3 https://github.com/jorgee16/investment_radar/releases/download/android-0.6.10-3996061ace1c/investment-radar-0.6.10.apk -o ../dist/android-inputs/previous-plan-release.apk
          echo "dba3e34236cc110eb6cc5a40861c64a2e88eb37e9ad191b6bf3a6ca16ecc6d76  ../dist/android-inputs/previous-plan-release.apk" | sha256sum --check
          python3 ../scripts/check_android_update.py ../dist/android-inputs/previous-plan-release.apk ../dist/android-inputs/investment-radar-0.6.11.apk --build-tools "$ANDROID_HOME/build-tools/35.0.0" > ../dist/android-inputs/plan-update-compatibility.json
          python3 ../scripts/check_android_update.py ../dist/android-inputs/previous-release.apk ../dist/android-inputs/investment-radar-0.6.11.apk --build-tools "$ANDROID_HOME/build-tools/35.0.0" > ../dist/android-inputs/update-compatibility.json
          ./gradlew :app:assembleRelease -PirVersionCode=19 -PirVersionName=0.6.11-upgrade-probe --no-daemon --console=plain
          cp app/build/outputs/apk/release/app-release.apk ../dist/android-inputs/upgrade-probe.apk
      - name: Enable KVM for the emulator
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Test installed Release APK on Android 15
        run: python3 scripts/run_android_emulator_ci.py --sdk "$ANDROID_HOME" --cli "$ANDROID_HOME/cmdline-tools/19.0/bin" --inputs dist/android-inputs --output dist/android-validation
      - name: Record emulator readiness
        if: always()
        shell: python
        run: |
          import pathlib
          path = pathlib.Path('dist/android-validation/emulator-readiness.json')
          if path.exists():
              print('::notice title=Emulator readiness::' + path.read_text().replace('\n', '%0A'))
      - name: Surface instrumentation failures in job annotations
        if: failure()
        shell: python
        run: |
          import pathlib, re
          path = pathlib.Path('dist/android-validation/instrumentation.txt')
          if not path.exists():
              print('::error title=Android validation::The emulator step stopped before producing an instrumentation report.')
          else:
              log = path.read_text(errors='replace')
              failures = re.findall(r'INSTRUMENTATION_STATUS: stack=(.*?)(?=\nINSTRUMENTATION_STATUS: stream=)', log, re.S)
              for failure in failures or [log[-4000:]]:
                  detail = '\n'.join(failure.splitlines()[:24])
                  detail = re.sub(r'https?://\S+', '[URL omitted]', detail)
                  detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error title=Android instrumentation::' + detail)
      - name: Require successful tests and screenshots before packaging candidate
        shell: python
        run: |
          import hashlib, json, os, pathlib, shutil, subprocess, sys, zipfile
          sys.path.insert(0, 'scripts')
          from check_android_update import apk_identity
          folder = pathlib.Path('dist/android-validation')
          report = json.loads((folder / 'result.json').read_text())
          assert report['passed'] and report['tests'] == 37, report
          assert len(list((folder / 'screenshots').rglob('*.png'))) >= 15
          tools = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools/35.0.0'
          source = pathlib.Path('dist/android-inputs/investment-radar-0.6.11.apk')
          identity = apk_identity(source, tools)
          assert identity['package'] == 'com.investmentradar.app' and identity['versionCode'] == 18 and identity['versionName'] == '0.6.11'
          public_certificate = subprocess.check_output(['keytool', '-exportcert', '-keystore', os.environ['IR_ANDROID_KEYSTORE'], '-storepass:env', 'IR_ANDROID_STORE_PASSWORD', '-alias', 'investment-radar'])
          assert identity['certificates'] == [hashlib.sha256(public_certificate).hexdigest()]
          assert report['apkSha256'] == identity['sha256']
          upgrade = json.loads((folder / 'future-upgrade/result.json').read_text())
          assert upgrade['passed'] and upgrade['syntheticProvidersVerified'] == 5 and upgrade['portfolioAndWatchlistPreserved'] and upgrade['investmentPlansPreserved'] and upgrade['discoveryMetadataPreserved']
          assert upgrade['compatibility']['previous']['sha256'] == identity['sha256']
          assert upgrade['compatibility']['candidate']['versionCode'] == 19
          assert upgrade['compatibility']['candidate']['certificates'] == identity['certificates']
          previous_upgrade = json.loads((folder / 'previous-upgrade/result.json').read_text())
          assert previous_upgrade['passed'] and previous_upgrade['syntheticProvidersVerified'] == 5
          assert previous_upgrade['compatibility']['candidate']['sha256'] == identity['sha256']
          assert previous_upgrade['compatibility']['previous']['sha256'] == 'b3c23d2a49be81bdb1570ca1bcede538b0abf0384b3def7d3544b22ecd37c05c'
          plan_upgrade = json.loads((folder / 'plan-upgrade/result.json').read_text())
          assert plan_upgrade['passed'] and plan_upgrade['investmentPlansPreserved']
          assert plan_upgrade['compatibility']['previous']['sha256'] == 'dba3e34236cc110eb6cc5a40861c64a2e88eb37e9ad191b6bf3a6ca16ecc6d76'
          assert plan_upgrade['compatibility']['candidate']['sha256'] == identity['sha256']
          manifest = dict(identity, sourceCommit=os.environ['GITHUB_SHA'], instrumentationTests=37, futureUpgradeVerified=True,
                          previous064UpgradeVerified=True, previous0610UpgradeVerified=True, investmentPlansPreserved=True, discoveryMetadataPreserved=True)
          (folder / 'release-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          review_names = {'visual-analyst-distribution.png', 'visual-financial-annual.png', 'visual-financial-dark.png', 'visual-metric-details.png', 'history-quota-empty.png', 'history-quota-cached.png', 'global-catalogue-name-search.png', 'global-company-profile.png', 'global-company-profile-dark.png', 'global-company-profile-landscape.png', 'global-etf-composition.png'}
          review_images = [p for p in (folder / 'screenshots').rglob('*.png') if p.name in review_names]
          assert {p.name for p in review_images} == review_names
          with zipfile.ZipFile(folder / 'android-ui-review.zip', 'w', zipfile.ZIP_DEFLATED) as review:
              for path in review_images:
                  review.write(path, path.name)
              review.write(folder / 'result.json', 'result.json')
              review.write(folder / 'release-manifest.json', 'release-manifest.json')
          shutil.copy2(source, folder / 'investment-radar-0.6.11.apk')
          (folder / 'investment-radar-0.6.11.apk.sha256').write_text(identity['sha256'] + '  investment-radar-0.6.11.apk\n')
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: investment-radar-android-candidate
          if-no-files-found: error
          path: dist/android-validation/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: investment-radar-android-test-reports
          path: |
            dist/android-validation/instrumentation.txt
            dist/android-validation/result.json
            dist/android-validation/emulator-readiness.json
            dist/android-validation/screenshots/
            dist/android-validation/runner-logs/*.txt
            dist/android-validation/future-upgrade/
            dist/android-validation/previous-upgrade/
            dist/android-validation/plan-upgrade/
            android/app/build/reports/lint-results-release.*
            android/app/build/test-results/testReleaseUnitTest/

  publish:
    needs: android
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/codex/initial-implementation'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: investment-radar-android-candidate
          path: validated
      - name: Publish standalone APK after successful validation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd validated
          sha256sum --check investment-radar-0.6.11.apk.sha256
          tag="android-0.6.11-${GITHUB_SHA:0:12}"
          cat > release-notes.md <<'NOTES'
          Android 0.6.11 (versionCode 18), signed with the configured persistent release certificate.
          All 37 Android emulator tests passed, with screenshots, lint and unit checks.
          A real same-certificate future upgrade preserved five encrypted provider credentials, portfolio and watchlist.
          An in-place upgrade from the published 0.6.4 APK also preserved all five encrypted keys, portfolio and watchlist.
          Adds offline discovery across 125,440 international stock/fund listings, identity marks and business/fund profiles independent of API access.
          ETF holdings and sector weights are rendered only when providers return valid composition data, with missing dates explicitly marked.
          Fixes duplicate chart requests, loads history before optional research, preserves matching cached charts on failure, reports quota errors and respects transport backoff.
          Adds Finnhub and Alpha Vantage analyst consensus, target ranges and additional overview growth metrics with independent source dates.
          Includes provider-backed name/ISIN discovery, searchable watchlists, an interactive earnings calendar, screener filters and side-by-side comparisons, plus aggregated portfolio positions and interactive allocation charts.
          Also validated an in-place update from the published 0.6.10 APK, preserving saved plans.
          Includes native investment plans with editable presets, sectors, custom allocations, asset discovery and monthly fixed-weight or contribution-only rebalancing. Saved plans are also preserved across package updates.
          Download investment-radar-0.6.11.apk directly. The upgrade-probe APK is never distributed.
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" investment-radar-0.6.11.apk investment-radar-0.6.11.apk.sha256 release-manifest.json android-ui-review.zip --clobber
          else
            gh release create "$tag" investment-radar-0.6.11.apk investment-radar-0.6.11.apk.sha256 release-manifest.json android-ui-review.zip --target "$GITHUB_SHA" --title "Investment Radar 0.6.11" --notes-file release-notes.md --prerelease
          fi
          echo "Standalone APK: https://github.com/$GH_REPO/releases/download/$tag/investment-radar-0.6.11.apk" >> "$GITHUB_STEP_SUMMARY"
